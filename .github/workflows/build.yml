# Build the libnode of every system and architecture; a tag v<version> (versions.env) releases them
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Android and HarmonyOS: the Dockerfile, natively on Linux x86_64
  linux:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, arch: arm64}
          - {platform: android, arch: arm}
          - {platform: android, arch: x64}
          - {platform: harmony, arch: arm64}
          - {platform: harmony, arch: x64}
    steps:
      - uses: actions/checkout@v7
      # The tools of the runner the build does not use: the build of Node.js takes about 15 GB
      - name: Free the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build
        run: node scripts/build.mjs ${{ matrix.platform }} ${{ matrix.arch }} --jobs 4
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
          retention-days: 7

  # iOS: each slice on a Mac of its own (a slice takes hours), then the xcframework
  ios-slice:
    name: ios ${{ matrix.slice }}
    runs-on: macos-26
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        slice: [arm64, arm64-simulator]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          PYTHON: python3.12
        run: ios/build.sh "$RUNNER_TEMP/ios" slice ${{ matrix.slice }}
      # Packed: the artifacts keep neither the modes of the files nor their links (without the metadata of macOS)
      - name: Pack
        env:
          COPYFILE_DISABLE: '1'
        run: tar --no-mac-metadata -czf "$RUNNER_TEMP/slice.tar.gz" -C "$RUNNER_TEMP/ios/node" "out_ios_${{ matrix.slice }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-slice-${{ matrix.slice }}
          path: ${{ runner.temp }}/slice.tar.gz
          compression-level: 0
          retention-days: 1

  ios:
    name: ios arm64
    needs: ios-slice
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ios-slice-*
          path: ${{ runner.temp }}/slices
      - name: Combine
        env:
          PYTHON: python3.12
        run: |
          mkdir -p "$RUNNER_TEMP/ios"
          ios/build.sh "$RUNNER_TEMP/ios" tree
          for slice in "$RUNNER_TEMP"/slices/*/slice.tar.gz; do tar -xzf "$slice" -C "$RUNNER_TEMP/ios/node"; done
          ios/build.sh "$RUNNER_TEMP/ios" combine "$RUNNER_TEMP/export"
          node scripts/package.mjs ios arm64 "$RUNNER_TEMP/export" dist
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-ios-arm64
          path: dist/*.tar.gz
          compression-level: 0
          retention-days: 7

  # The release files of every build (checked on each run), released for a tag
  release:
    needs: [linux, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: libnode-*
          merge-multiple: true
          path: dist
      - name: Manifest
        run: node scripts/manifest.mjs dist ${{ startsWith(github.ref, 'refs/tags/v') && format('--tag {0}', github.ref_name) || '' }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/manifest.json --title "libnode $GITHUB_REF_NAME" --notes-file dist/notes.md
